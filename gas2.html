<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Energy & Emergency Fuel Monitor</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; background: #0f172a; color: #f8fafc; padding: 16px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1240px; display: flex; flex-direction: column; gap: 14px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 12px; border: 1px solid #334155; }
    .title { font-size: 20px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .live-badge { background: #ef4444; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .main-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; }
    .col { display: flex; flex-direction: column; gap: 14px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
    .card-title { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .stat-box { background: #0b1120; padding: 12px 14px; border-radius: 8px; border-left: 4px solid #38bdf8; }
    .stat-title { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .stat-val { font-size: 18px; font-weight: bold; }
    .w-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 13px; border-bottom: 1px solid #334155; }
    .w-row:last-child { border-bottom: none
